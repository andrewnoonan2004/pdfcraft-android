name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_rust_from_source:
        description: 'Compile Rust native engine from source (slower)'
        required: false
        default: false
        type: boolean
      upload_to_release:
        description: 'Attach built APK to GitHub Release (for tags or specified release)'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Non-Debug (Release) APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Optional: Compile native Rust bridge from source if requested
      - name: Set up Rust Toolchain
        if: ${{ github.event.inputs.build_rust_from_source == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install Android NDK
        if: ${{ github.event.inputs.build_rust_from_source == 'true' }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build Rust Native Libraries (libpdfcraft_android.so)
        if: ${{ github.event.inputs.build_rust_from_source == 'true' }}
        run: |
          chmod +x scripts/build-android-rust.sh
          bash scripts/build-android-rust.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Restore Keystore from GitHub Secret if provided; fallback to committed keystore
      - name: Prepare Signing Keystore
        run: |
          mkdir -p app/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using upload keystore from KEYSTORE_BASE64 secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/pdfcraft.jks
          else
            echo "Using default repository keystore..."
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'pdfcraft_store_2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pdfcraft' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'pdfcraft_store_2026' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify Signed Release APK & Checksum
        run: |
          APK_FILE="app/build/outputs/apk/release/PdfCraft-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: $APK_FILE does not exist!"
            exit 1
          fi

          echo "APK Details:"
          ls -lh "$APK_FILE"

          # Verify Signature (apksigner or fallback jarsigner)
          if [ -f "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_FILE"
          else
            jarsigner -verify -verbose -certs "$APK_FILE" | grep -E "jar verified|signed" | head -n 5
          fi

          # Generate SHA256 checksum
          cd app/build/outputs/apk/release
          sha256sum PdfCraft-release.apk > PdfCraft-release.apk.sha256
          cat PdfCraft-release.apk.sha256

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-release-apk
          path: |
            app/build/outputs/apk/release/PdfCraft-release.apk
            app/build/outputs/apk/release/PdfCraft-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # Attach to GitHub Release when triggered by tag (v*) or if upload_to_release is enabled
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload_to_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/PdfCraft-release.apk
            app/build/outputs/apk/release/PdfCraft-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
